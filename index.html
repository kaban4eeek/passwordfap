<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PasswordFap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0d14;
    --surface:   #15151f;
    --card:      #1b1b27;
    --input-bg:  #22222f;
    --border:    #2c2c3e;
    --accent:    #7b6cff;
    --text:      #e2e2f0;
    --sub:       #7777a0;
    --danger:    #ff4d6d;
    --green:     #3ddc84;
    --radius:    14px;
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .header-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .header-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--sub);
    background: var(--input-bg);
    padding: 3px 9px;
    border-radius: 20px;
  }

  /* ── List ── */
  .list {
    padding: 14px 12px 100px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: calc(100dvh - 57px);
  }

  /* ── Card ── */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: slideIn 0.18s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Icon */
  .card-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 22px;
    text-align: center;
    line-height: 42px;
    cursor: text;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .card-icon:focus { border-color: var(--accent); }

  /* Fields */
  .card-fields { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .field-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .field-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--sub);
    width: 52px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .field-input {
    flex: 1;
    min-width: 0;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-input::placeholder { color: var(--sub); }

  /* Password row */
  .pass-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
  }
  .pass-wrap .field-input { width: 100%; padding-right: 36px; }
  .btn-eye {
    position: absolute;
    right: 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    color: var(--sub);
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }
  .btn-eye:hover { color: var(--text); }

  /* Delete */
  .btn-delete {
    flex-shrink: 0;
    align-self: flex-start;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: var(--sub);
    padding: 6px 4px;
    border-radius: 6px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .btn-delete:hover { color: var(--danger); background: rgba(255,77,109,0.1); }

  /* Copy */
  .btn-copy {
    flex-shrink: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--sub);
    padding: 5px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .btn-copy:hover { color: var(--accent); background: rgba(123,108,255,0.12); }
  .btn-copy.copied { color: var(--green); }

  /* Saved dot */
  .save-dot {
    position: absolute;
    top: 10px;
    right: 40px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .save-dot.dirty { opacity: 1; }
  .save-dot.saved { background: var(--green); opacity: 1; }

  /* ── FAB — iOS glass ── */
  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    cursor: pointer;
    box-shadow:
      0 0 0 0.5px rgba(255,255,255,0.08) inset,
      0 2px 8px rgba(0,0,0,0.45),
      0 8px 28px rgba(0,0,0,0.35),
      0 0 24px rgba(123,108,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    z-index: 20;
    padding: 0 0 2px 0;
    font-size: 30px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .fab:active {
    transform: scale(0.91);
    background: rgba(255,255,255,0.16);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: calc(92px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #27273a;
    color: var(--text);
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Empty / Loading ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--sub);
    padding: 60px 20px;
    text-align: center;
  }
  .empty-icon { font-size: 48px; }
  .empty-text { font-size: 15px; }
  .empty-hint { font-size: 13px; opacity: 0.7; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <img class="header-logo" src="icon.png" alt="" />
  <span class="header-title">PasswordFap</span>
  <span class="header-count" id="countBadge">…</span>
</div>

<div class="list" id="list">
  <div class="empty">
    <div class="spinner"></div>
    <div class="empty-text">Загрузка…</div>
  </div>
</div>

<button class="fab" id="fabBtn" title="Добавить запись">+</button>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();

// ── Config ────────────────────────────────────────────────────────────────────
const GITHUB_RAW = "https://raw.githubusercontent.com/kaban4eeek/passwordfap/main/api_url.txt";
let API_BASE = null;
const initData = tg.initData || "";

// ── Helpers ───────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, duration = 1800) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), duration);
}

function updateCount(n) {
  const s = n === 1 ? "1 запись" : n < 5 && n > 0 ? `${n} записи` : `${n} записей`;
  document.getElementById("countBadge").textContent = s;
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ── API ───────────────────────────────────────────────────────────────────────
async function apiFetch(path, options = {}) {
  const headers = { "Content-Type": "application/json", "X-Init-Data": initData, ...(options.headers || {}) };
  const r = await fetch(API_BASE + path, { ...options, headers });
  if (r.status === 204) return null;
  return r.json();
}

async function apiLoad()           { return apiFetch("/api/entries"); }
async function apiCreate(e)        { return apiFetch("/api/entries", { method: "POST", body: JSON.stringify(e) }); }
async function apiUpdate(id, e)    { return apiFetch(`/api/entries/${id}`, { method: "PUT",  body: JSON.stringify(e) }); }
async function apiDelete(id)       { return apiFetch(`/api/entries/${id}`, { method: "DELETE" }); }

// ── State ─────────────────────────────────────────────────────────────────────
let entries = [];
const saveTimers = {};

const COPY_SVG  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
const CHECK_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  updateCount(entries.length);

  if (!entries.length) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔑</div>
        <div class="empty-text">Нет сохранённых паролей</div>
        <div class="empty-hint">Нажми «+» чтобы добавить запись</div>
      </div>`;
    return;
  }

  entries.forEach(e => list.appendChild(buildCard(e)));
}

function buildCard(entry) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = entry.id;

  card.innerHTML = `
    <input class="card-icon" type="text" value="${esc(entry.icon)}" maxlength="2" data-f="icon" />
    <div class="card-fields">
      <div class="field-row">
        <span class="field-label">Логин</span>
        <input class="field-input" type="text" placeholder="username / email"
               value="${esc(entry.login)}" data-f="login" autocomplete="off" />
        <button class="btn-copy" type="button" data-copy="login" title="Копировать логин">${COPY_SVG}</button>
      </div>
      <div class="field-row">
        <span class="field-label">Пароль</span>
        <div class="pass-wrap">
          <input class="field-input" type="password" placeholder="••••••••"
                 value="${esc(entry.password)}" data-f="password" autocomplete="off" />
          <button class="btn-eye" type="button">👁</button>
        </div>
        <button class="btn-copy" type="button" data-copy="password" title="Копировать пароль">${COPY_SVG}</button>
      </div>
      <div class="field-row">
        <span class="field-label">Заметка</span>
        <input class="field-input" type="text" placeholder="описание…"
               value="${esc(entry.note)}" data-f="note" />
      </div>
    </div>
    <div class="save-dot" data-dot></div>
    <button class="btn-delete" type="button">🗑</button>
  `;

  // Input → debounced save
  card.querySelectorAll("[data-f]").forEach(inp => {
    inp.addEventListener("input", () => onInput(card, entry));
  });

  // Eye toggle
  const passInp = card.querySelector("[data-f='password']");
  card.querySelector(".btn-eye").addEventListener("click", e => {
    const show = passInp.type === "password";
    passInp.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "🙈" : "👁";
  });

  // Copy buttons
  card.querySelectorAll(".btn-copy").forEach(btn => {
    btn.addEventListener("click", () => {
      const field = btn.dataset.copy;
      const val = card.querySelector(`[data-f="${field}"]`).value;
      if (!val) { showToast("Поле пустое"); return; }
      navigator.clipboard.writeText(val).then(() => {
        btn.innerHTML = CHECK_SVG;
        btn.classList.add("copied");
        showToast((field === "login" ? "Логин" : "Пароль") + " скопирован ✓");
        setTimeout(() => { btn.innerHTML = COPY_SVG; btn.classList.remove("copied"); }, 1500);
      });
    });
  });

  // Delete
  card.querySelector(".btn-delete").addEventListener("click", async () => {
    await apiDelete(entry.id);
    entries = entries.filter(e => e.id !== entry.id);
    card.style.transition = "opacity 0.18s, transform 0.18s";
    card.style.opacity = "0";
    card.style.transform = "translateX(20px)";
    setTimeout(() => { card.remove(); updateCount(entries.length); if (!entries.length) renderAll(); }, 200);
  });

  return card;
}

// ── Input & save ──────────────────────────────────────────────────────────────
function onInput(card, entry) {
  const dot = card.querySelector("[data-dot]");
  dot.className = "save-dot dirty";
  clearTimeout(saveTimers[entry.id]);
  saveTimers[entry.id] = setTimeout(() => commitCard(card, entry, dot), 900);
}

function commitCard(card, entry, dot) {
  entry.icon     = card.querySelector("[data-f='icon']").value.trim() || "🔑";
  entry.login    = card.querySelector("[data-f='login']").value.trim();
  entry.password = card.querySelector("[data-f='password']").value;
  entry.note     = card.querySelector("[data-f='note']").value.trim();
  apiUpdate(entry.id, entry).then(() => {
    dot.className = "save-dot saved";
    setTimeout(() => { dot.className = "save-dot"; }, 1200);
  });
}

// ── Add ───────────────────────────────────────────────────────────────────────
document.getElementById("fabBtn").addEventListener("click", async () => {
  const newEntry = { icon: "🔑", login: "", password: "", note: "" };
  const res = await apiCreate(newEntry);
  if (!res?.id) { showToast("Ошибка сервера"); return; }

  newEntry.id = res.id;
  entries.unshift(newEntry);

  const list = document.getElementById("list");
  if (list.querySelector(".empty")) list.innerHTML = "";
  const card = buildCard(newEntry);
  list.prepend(card);
  updateCount(entries.length);
  card.querySelector("[data-f='icon']").focus();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  // 1. Get API URL from GitHub
  for (let attempt = 1; attempt <= 5; attempt++) {
    try {
      const r = await fetch(GITHUB_RAW + "?t=" + Date.now());
      if (r.ok) {
        API_BASE = (await r.text()).trim();
        break;
      }
    } catch (_) {}
    await new Promise(res => setTimeout(res, 2000));
  }

  if (!API_BASE) {
    document.getElementById("list").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">Сервер недоступен</div>
        <div class="empty-hint">Попробуй перезапустить приложение</div>
      </div>`;
    updateCount(0);
    return;
  }

  // 2. Load entries
  try {
    entries = await apiLoad();
    renderAll();
  } catch {
    document.getElementById("list").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">Не удалось загрузить данные</div>
        <div class="empty-hint">Попробуй ещё раз</div>
      </div>`;
    updateCount(0);
  }
}

boot();
</script>
</body>
</html>
